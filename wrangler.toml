name = "puzzle-party"
main = "src/index.js"             # Make sure this file really exists
compatibility_date = "2024-11-01"

# Binding for the static-site assets
[site]
bucket = "./public"
run_worker_first = true   # <-- ADD THIS LINE

# Bindings for both Durable Object classes
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "ESCAPE_ROOM"
class_name = "EscapeRoom"

# Migrations: each class must appear in its own migration
[[migrations]]
tag = "v1"
new_classes = ["Room"]

[[migrations]]
tag = "v2"
new_classes = ["EscapeRoom"]