<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puzzle Party</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="puzzle">
  <div id="app" style="max-width:500px; width:100%; padding:20px;">
    <div id="lobby" class="screen">
      <h1>🧩 Puzzle Party</h1>
      <p style="color:#aaa;">Collaborate with friends to complete the picture!</p>
      <div class="lobby-actions">
        <button id="createBtn" style="background:#00ff88; color:#1a1a2e;">Create Room</button>
        <div class="join-row">
          <input id="roomInput" type="text" placeholder="Room code" maxlength="6" />
          <button id="joinBtn">Join</button>
        </div>
      </div>
      <input id="nameInput" type="text" placeholder="Your name" value="Player" />
    </div>
    <div id="game" class="screen hidden">
      <div id="topBar">
        <span class="room-code" id="roomCodeDisplay"></span>
        <span class="players-list" id="playersList"></span>
      </div>
      <div id="board"></div>
      <div id="pool">
        <h3 style="margin:10px 0;">🧩 Available Pieces</h3>
        <div id="piecesContainer"></div>
        <div id="selectedIndicator"></div>
      </div>
      <div id="winOverlay" class="hidden" style="font-size:2rem; color:gold; margin:20px;">🎉 Puzzle Complete! 🎉</div>
    </div>
    <div id="confettiContainer"></div>
  </div>
  <script src="/game.js"></script>
</body>
</html>
